<!--
  Shared configuration of the agents, sent by the manager to every group.
  Replaced at each update: put a local change in /var/ossec/etc/ossec.conf on the agent.
  The ignore patterns are simple Wazuh regexes: only ^, $ and | are special, a dot is a dot.
-->
<agent_config>
  <syscheck>
    <!-- Proxmox: the cluster filesystem rewrites its status files all day and rotates its auth key every day.
         The configuration files, users, storage, firewall and guests, stay watched. -->
    <ignore type="sregex">^/etc/pve/.|/lrm_status$|^/etc/pve/authkey.|^/etc/pve/priv/authkey.</ignore>
    <!-- GRUB rewrites its few hundred modules at each kernel update, the kernel files stay watched -->
    <ignore type="sregex">^/boot/grub/</ignore>
  </syscheck>
</agent_config>
